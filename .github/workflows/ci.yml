name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test (unit, embedded Kafka, MCP end-to-end, Testcontainers Kafka)
        run: mvn -B -ntp verify

      - name: Fail if the Testcontainers suite was skipped
        run: |
          report=target/surefire-reports/io.github.gratycodes.kafkaops.it.ContainerKafkaScenariosTest.txt
          cat "$report"
          grep -q "Skipped: 0" "$report"

      - name: Test summary
        if: always()
        run: |
          for f in target/surefire-reports/*.txt; do sed -n 4p "$f"; done | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: surefire-reports
          path: target/surefire-reports
